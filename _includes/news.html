<div class="well">
<h4>News</h4>

{% for article in site.data.news limit:9 %}
<p>
  {{ article.date }}<br>
  {% if article.icon %}
    <i class="{{ article.icon }}"></i>
  {% endif %}
  {{ article.headline | markdownify }}
</p>
{% endfor %}

<h4><a href="{{ site.url }}{{ site.baseurl }}/allnews.html">... see all News</a></h4>
</div>
